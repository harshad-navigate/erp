<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f1">
  <title>Order details — Swadisht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #20342b; --muted: #788078; --green: #2f684a; --green-dark: #214e37; --cream: #f7f6f1; --paper: #fffefa; --line: #e9e8e0; --soft: #f1f2eb; --field: #fff; --header: rgba(247,246,241,.93); --shadow: 0 16px 42px rgba(32,52,43,.08); color-scheme: light;
    }
    :root[data-theme="dark"] {
      --ink: #f0f3ed; --muted: #a5b0a7; --green: #8bc69b; --green-dark: #183c2b; --cream: #151d18; --paper: #1d2821; --line: #344239; --soft: #29362e; --field: #26332b; --header: rgba(21,29,24,.93); --shadow: 0 16px 42px rgba(0,0,0,.28); color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: "DM Sans","Noto Sans Gujarati","Noto Sans Devanagari",sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button,select { font: inherit; }
    button { cursor: pointer; }
    .container { width: min(1050px,calc(100% - 40px)); margin: 0 auto; }
    header { position: sticky; z-index: 4; top: 0; border-bottom: 1px solid var(--line); background: var(--header); backdrop-filter: blur(14px); }
    .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 15px; background: var(--green-dark); color: white; }
    .brand-mark svg { width: 35px; height: 35px; }
    .brand-name { display: block; font-size: 15px; font-weight: 800; }
    .brand-tag { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .language, .theme { min-height: 39px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); color: var(--ink); }
    .language { padding: 0 10px; font-size: 11px; font-weight: 700; }
    .theme { width: 39px; display: grid; place-items: center; }
    .theme svg { width: 17px; height: 17px; }
    main { padding: 48px 0 75px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .eyebrow { color: var(--green); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 5px; font-size: clamp(30px,5vw,43px); letter-spacing: -.05em; }
    .page-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .back-link { color: var(--green); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .order-layout { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(270px,.75fr); align-items: start; gap: 20px; }
    .items-panel, .summary-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; padding: 17px 19px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 800; }
    .item-count { color: var(--muted); font-size: 10px; font-weight: 600; }
    .order-items { padding: 0 19px; }
    .order-item { display: grid; grid-template-columns: 90px minmax(0,1fr) auto; align-items: center; gap: 14px; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .order-item:last-child { border-bottom: 0; }
    .item-image { width: 90px; height: 76px; border-radius: 12px; background-position: center; background-size: cover; background-color: var(--soft); }
    .item-category { color: var(--green); font-size: 9px; font-weight: 700; }
    .item-name { margin: 4px 0; font-size: 13px; font-weight: 800; }
    .item-description { max-width: 430px; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .item-includes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .ingredient { padding: 4px 6px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 8px; }
    .image-credit { display: block; margin-top: 6px; color: var(--muted); font-size: 8px; line-height: 1.5; }
    .image-credit a { color: var(--green); text-decoration: underline; text-underline-offset: 2px; }
    .item-side { min-width: 83px; text-align: right; }
    .item-total { font-size: 13px; font-weight: 800; }
    .item-unit { margin-top: 4px; color: var(--muted); font-size: 9px; }
    .quantity { display: flex; align-items: center; justify-content: flex-end; gap: 7px; margin-top: 9px; }
    .quantity button { width: 25px; height: 25px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--green); font-weight: 800; }
    .quantity span { min-width: 13px; font-size: 10px; font-weight: 700; text-align: center; }
    .summary-body { padding: 18px 19px; }
    .summary-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 13px; color: var(--muted); font-size: 11px; }
    .summary-row.total { margin: 17px 0 0; padding-top: 15px; border-top: 1px solid var(--line); color: var(--ink); font-size: 15px; font-weight: 800; }
    .summary-note { margin: 14px 0 0; color: var(--muted); font-size: 9px; line-height: 1.6; }
    .summary-actions { display: grid; gap: 9px; margin-top: 18px; }
    .button { min-height: 43px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--green-dark); color: white; font-size: 11px; font-weight: 800; }
    .button:hover { filter: brightness(1.1); }
    .button.secondary { border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
    .empty-state { padding: 48px 22px; color: var(--muted); text-align: center; font-size: 13px; }
    .empty-state a { display: inline-block; margin-top: 14px; color: var(--green); font-weight: 800; }
    .toast { position: fixed; right: 16px; bottom: 16px; z-index: 6; padding: 12px 16px; border-radius: 11px; background: var(--green-dark); color: white; font-size: 11px; opacity: 0; transform: translateY(8px); transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 700px) {
      .container { width: min(100% - 28px,500px); }
      .nav { min-height: 64px; }
      .brand-mark { width: 38px; height: 38px; }
      .brand-mark svg { width: 31px; height: 31px; }
      .brand-name { font-size: 13px; }
      .brand-tag { font-size: 8px; }
      .language { min-height: 36px; padding: 0 7px; font-size: 10px; }
      .theme { width: 36px; min-height: 36px; }
      main { padding: 32px 0 45px; }
      .page-heading { align-items: start; }
      .page-heading p { max-width: 280px; line-height: 1.5; }
      .back-link { margin-top: 4px; font-size: 10px; }
      .order-layout { grid-template-columns: 1fr; gap: 13px; }
      .order-item { grid-template-columns: 70px minmax(0,1fr) auto; gap: 9px; padding: 13px 0; }
      .item-image { width: 70px; height: 72px; }
      .item-name { font-size: 11px; }
      .item-description { font-size: 9px; }
      .item-side { min-width: 70px; }
      .item-total { font-size: 11px; }
      .order-items { padding: 0 12px; }
      .panel-heading { padding: 14px; }
      .summary-body { padding: 15px; }
      .summary-actions { grid-template-columns: 1fr 1fr; }
    }
    @media print {
      header, .page-heading .back-link, .summary-actions, .theme, .language { display: none !important; }
      body { background: white; color: #222; }
      main { padding: 15px 0; }
      .items-panel, .summary-panel { box-shadow: none; }
      .order-layout { grid-template-columns: 1fr 250px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav container" aria-label="Main navigation">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 25h34c-1.6 9.5-8.1 15-17 15S8.6 34.5 7 25Z" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><path d="M11 21h26M16 16c-2-2-2-4 0-6m8 6c-2-2-2-4 0-6m8 6c-2-2-2-4 0-6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M17 31c2 2 4 3 7 3s5-1 7-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span><span class="brand-name">Swadisht</span><span class="brand-tag" id="brandTag"></span></span>
      </a>
      <div class="nav-actions">
        <select class="language" id="language" aria-label="Choose language">
          <option value="gu">ગુજરાતી</option><option value="hi">हिन्दी</option><option value="en">English</option>
        </select>
        <button class="theme" id="theme" type="button" aria-label="Change theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></button>
      </div>
    </nav>
  </header>
  <main class="container">
    <div class="page-heading">
      <div><span class="eyebrow" id="eyebrow"></span><h1 id="pageTitle"></h1><p id="pageDescription"></p></div>
      <a class="back-link" href="index.html" id="backLink"></a>
    </div>
    <div class="order-layout">
      <section class="items-panel">
        <div class="panel-heading"><span id="itemsTitle"></span><span class="item-count" id="itemCount"></span></div>
        <div class="order-items" id="orderItems"></div>
      </section>
      <aside class="summary-panel">
        <div class="panel-heading" id="summaryTitle"></div>
        <div class="summary-body">
          <div class="summary-row"><span id="itemsSubtotalLabel"></span><span id="itemsSubtotal"></span></div>
          <div class="summary-row"><span id="deliveryLabel"></span><span id="deliveryValue"></span></div>
          <div class="summary-row total"><span id="totalLabel"></span><span id="totalValue"></span></div>
          <p class="summary-note" id="summaryNote"></p>
          <div class="summary-actions"><a class="button secondary" href="index.html" id="continueButton"></a><button class="button" id="printButton" type="button"></button></div>
        </div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const copy = {
      gu: {tag:"સ્વાદ, તમારી પસંદ",eyebrow:"ઓર્ડર",title:"ઓર્ડરની વિગતો",description:"તમારી પસંદ કરેલી વાનગીઓ અને કુલ રકમ.",back:"← મેનુ પર પાછા",items:"પસંદ કરેલી વાનગીઓ",one:"વાનગી",many:"વાનગીઓ",summary:"બિલ વિગતો",subtotal:"વાનગીઓનો કુલ",delivery:"ડિલિવરી",included:"રેસ્ટોરન્ટ પર",total:"કુલ રકમ",note:"ડિલિવરી અને ટેક્સ લાગુ પડતા હોય તો રેસ્ટોરન્ટ પર જણાવવામાં આવશે.",continue:"બીજી વાનગી ઉમેરો",print:"ઓર્ડર પ્રિન્ટ કરો",empty:"હજુ કોઈ વાનગી પસંદ નથી.",add:"મેનુ જુઓ",perItem:"નંગ",decrease:"ઘટાડો",increase:"વધારો",themeLight:"લાઇટ મોડ",themeDark:"ડાર્ક મોડ",removed:"વાનગી ઓર્ડરમાંથી દૂર કરી",count:(n)=>`${n} ${n===1?"વાનગી":"વાનગીઓ"}`},
      hi: {tag:"स्वाद, आपकी पसंद",eyebrow:"ऑर्डर",title:"ऑर्डर की जानकारी",description:"आपकी चुनी हुई डिश और कुल कीमत.",back:"← मेन्यू पर वापस",items:"चुनी हुई डिश",one:"डिश",many:"डिश",summary:"बिल की जानकारी",subtotal:"डिश का कुल",delivery:"डिलीवरी",included:"रेस्तरां पर",total:"कुल कीमत",note:"डिलीवरी और टैक्स लागू होने पर रेस्तरां में बताए जाएँगे.",continue:"एक और डिश जोड़ें",print:"ऑर्डर प्रिंट करें",empty:"अभी कोई डिश नहीं चुनी गई.",add:"मेन्यू देखें",perItem:"पीस",decrease:"कम करें",increase:"बढ़ाएँ",themeLight:"लाइट मोड",themeDark:"डार्क मोड",removed:"डिश ऑर्डर से हटा दी",count:(n)=>`${n} डिश`},
      en: {tag:"Good food, your choice",eyebrow:"Order",title:"Order details",description:"Your selected dishes and total.",back:"← Back to menu",items:"Selected items",one:"item",many:"items",summary:"Bill details",subtotal:"Items subtotal",delivery:"Delivery",included:"At restaurant",total:"Total",note:"Any delivery charges or taxes will be shared by the restaurant.",continue:"Add more dishes",print:"Print order",empty:"You haven't selected any dishes yet.",add:"Browse menu",perItem:"pc",decrease:"Decrease",increase:"Increase",themeLight:"Light mode",themeDark:"Dark mode",removed:"Item removed from order",count:(n)=>`${n} ${n===1?"item":"items"}`}
    };
    const money = (value) => `₹${Number(value).toLocaleString("en-IN")}`;
    const safe = (value) => String(value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    let order = JSON.parse(localStorage.getItem("swadisht-order") || '{"items":[]}');
    let lang = ["gu","hi","en"].includes(localStorage.getItem("swadisht-language")) ? localStorage.getItem("swadisht-language") : (["gu","hi","en"].includes(order.lang) ? order.lang : "gu");
    let theme = localStorage.getItem("swadisht-theme") === "dark" ? "dark" : "light";
    let toastTimer;
    function currentText() { return copy[lang]; }
    function persist() {
      order.lang = lang;
      order.theme = theme;
      localStorage.setItem("swadisht-order", JSON.stringify(order));
    }
    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#151d18" : "#f7f6f1";
      document.querySelector('title').textContent = `${currentText().title} — Swadisht`;
      $("#themeIcon").innerHTML = theme === "dark"
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
        : '<path d="M20.8 13A8.5 8.5 0 0 1 11 3.2 8.5 8.5 0 1 0 20.8 13Z"/>';
      $("#theme").setAttribute("aria-label", theme === "dark" ? currentText().themeLight : currentText().themeDark);
    }
    function render() {
      const t = currentText();
      const items = Array.isArray(order.items) ? order.items : [];
      const quantity = items.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
      const subtotal = items.reduce((sum, item) => sum + Number(item.p || 0) * Number(item.quantity || 0), 0);
      document.documentElement.lang = lang;
      $("#brandTag").textContent = t.tag;
      $("#eyebrow").textContent = t.eyebrow;
      $("#pageTitle").textContent = t.title;
      $("#pageDescription").textContent = t.description;
      $("#backLink").textContent = t.back;
      $("#itemsTitle").textContent = t.items;
      $("#itemCount").textContent = t.count(quantity);
      $("#summaryTitle").textContent = t.summary;
      $("#itemsSubtotalLabel").textContent = t.subtotal;
      $("#itemsSubtotal").textContent = money(subtotal);
      $("#deliveryLabel").textContent = t.delivery;
      $("#deliveryValue").textContent = t.included;
      $("#totalLabel").textContent = t.total;
      $("#totalValue").textContent = money(subtotal);
      $("#summaryNote").textContent = t.note;
      $("#continueButton").textContent = t.continue;
      $("#printButton").textContent = t.print;
      $("#language").value = lang;
      $("#orderItems").innerHTML = items.length ? items.map((item, index) => {
        const name = item.n?.[["gu","hi","en"].indexOf(lang)] || item.n?.[0] || "";
        const description = item.d?.[["gu","hi","en"].indexOf(lang)] || item.d?.[0] || "";
        const category = t.categories?.[item.c] || ({gu:{gujarati:"ગુજરાતી",punjabi:"પંજાબી",kathiyawadi:"કાઠિયાવાડી",chinese:"ચાઇનીઝ",south:"સાઉથ ઇન્ડિયન",pizza:"પિઝા",burger:"બર્ગર",sandwich:"સેન્ડવિચ",fastfood:"ફાસ્ટ ફૂડ",thali:"થાળી",drinks:"પીણાં",dessert:"મીઠાઈ"},hi:{gujarati:"गुजराती",punjabi:"पंजाबी",kathiyawadi:"काठियावाड़ी",chinese:"चाइनीज़",south:"साउथ इंडियन",pizza:"पिज़्ज़ा",burger:"बर्गर",sandwich:"सैंडविच",fastfood:"फ़ास्ट फ़ूड",thali:"थाली",drinks:"पेय",dessert:"मिठाई"},en:{gujarati:"Gujarati",punjabi:"Punjabi",kathiyawadi:"Kathiyawadi",chinese:"Chinese",south:"South Indian",pizza:"Pizza",burger:"Burgers",sandwich:"Sandwiches",fastfood:"Fast food",thali:"Thalis",drinks:"Drinks",dessert:"Desserts"}}[lang][item.c] || "");
        const ingredients = (item.i || []).map((values) => values[["gu","hi","en"].indexOf(lang)] || values[0]).map((value) => `<span class="ingredient">${safe(value)}</span>`).join("");
        const image = item.im?.startsWith("https://") ? item.im : `https://images.unsplash.com/${encodeURIComponent(item.im || "")}?auto=format&fit=crop&w=240&q=75`;
        const credit = item.credit ? `<small class="image-credit">Photo: <a href="${safe(item.credit.link)}" target="_blank" rel="noopener noreferrer">${safe(item.credit.name)}</a> · <a href="${safe(item.credit.licenseUrl)}" target="_blank" rel="noopener noreferrer">${safe(item.credit.license)}</a> · cropped</small>` : "";
        return `<article class="order-item"><div class="item-image" role="img" aria-label="${safe(name)}" style="background-image:url('${safe(image)}')"></div><div><span class="item-category">${safe(category)}</span><h3 class="item-name">${safe(name)}</h3><p class="item-description">${safe(description)}</p><div class="item-includes">${ingredients}</div>${credit}</div><div class="item-side"><div class="item-total">${money(item.p * item.quantity)}</div><div class="item-unit">${money(item.p)} / ${safe(t.perItem)}</div><div class="quantity"><button type="button" data-qty="-1" data-index="${index}" aria-label="${safe(t.decrease)}">−</button><span>${item.quantity}</span><button type="button" data-qty="1" data-index="${index}" aria-label="${safe(t.increase)}">+</button></div></div></article>`;
      }).join("") : `<div class="empty-state">${safe(t.empty)}<br><a href="index.html">${safe(t.add)} →</a></div>`;
      $("#printButton").disabled = !items.length;
      $("#printButton").style.opacity = items.length ? "1" : ".55";
      applyTheme();
    }
    function $(selector) { return document.querySelector(selector); }
    function showToast(message) {
      const toast = $("#toast"); toast.textContent = message; toast.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }
    $("#language").addEventListener("change", (event) => {
      lang = event.target.value;
      localStorage.setItem("swadisht-language", lang);
      persist();
      render();
    });
    $("#theme").addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      localStorage.setItem("swadisht-theme", theme);
      persist();
      render();
    });
    $("#orderItems").addEventListener("click", (event) => {
      const button = event.target.closest("[data-qty]");
      if (!button) return;
      const index = Number(button.dataset.index);
      const next = Number(order.items[index].quantity) + Number(button.dataset.qty);
      if (next <= 0) {
        order.items.splice(index, 1);
        showToast(currentText().removed);
      } else {
        order.items[index].quantity = next;
      }
      persist();
      render();
    });
    $("#printButton").addEventListener("click", () => window.print());
    if (!Array.isArray(order.items)) order.items = [];
    render();
  </script>
</body>
</html>
